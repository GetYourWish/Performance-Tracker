[package]
name = "performance-tracker"
version = "1.0.0"
description = "A personal local-first performance tracker"
authors = ["Performance Tracker"]
license = "MIT"
repository = "https://github.com/GetYourWish/Performance-Tracker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
